name: Daily Random Pick

on:
  schedule:
    - cron: "0 4 * * *"   # 06:00 Berliner Zeit (UTC+2)
    - cron: "0 10 * * *"  # 12:00 Berliner Zeit (UTC+2)
    - cron: "0 16 * * *"  # 18:00 Berliner Zeit (UTC+2)

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "data/entries.json"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  pick:
    runs-on: ubuntu-latest

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zufälligen Eintrag wählen
        run: python scripts/pick_random.py

      - name: result.json committen & pushen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add result.json
          git diff --cached --quiet || git commit -m "chore: random pick [skip ci]"
          git push
