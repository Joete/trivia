name: Daily Random Pick

on:
  # Täglich um 06:00 UTC automatisch
  schedule:
    - cron: "0 6 * * *"

  # Manuell auslösbar über das Actions-Tab im Repo
  workflow_dispatch:

  # Optional: bei jedem Push auf main (nützlich beim Setup)
  push:
    branches:
      - main
    paths:
      - "data/entries.json"   # Nur wenn sich die Datenbasis ändert

permissions:
  contents: write   # Nötig damit der Action result.json committen darf

jobs:
  pick:
    runs-on: ubuntu-latest

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zufälligen Eintrag wählen
        run: python scripts/pick_random.py

      - name: result.json committen & pushen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add result.json
          # Nur committen wenn sich etwas geändert hat
          git diff --cached --quiet || git commit -m "chore: daily random pick [skip ci]"
          git push
